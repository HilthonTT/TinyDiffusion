version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      # One PR for routine dev-tooling bumps instead of five.
      dev-tools:
        patterns: ["ruff", "mypy", "pytest*", "pre-commit"]
        update-types: ["minor", "patch"]
      minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["torch", "torchvision"]
        update-types: ["minor", "patch"]
    ignore:
      # Torch major bumps change kernels and numerics; take them deliberately.
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "torchvision"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
