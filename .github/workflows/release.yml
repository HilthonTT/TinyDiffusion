name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The full CI suite, against the tagged commit. Tags aren't pushes to main, so
  # nothing else guarantees CI ever ran on exactly what is about to be published,
  # and a PyPI version can't be replaced once it's up. CI's build job also
  # uploads the `dist` artifact the jobs below publish, so what reaches PyPI is
  # the exact sdist and wheel that passed `twine check`, not a second build.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tinydiffusion
    permissions:
      id-token: write # Trusted publishing — no API token stored in the repo.
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
