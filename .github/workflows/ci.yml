name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep CI on CPU wheels: the CUDA builds are multi-GB and useless on hosted
  # runners. `--no-sources` on every sync below is what does it — it ignores
  # the [tool.uv.sources] table that points Windows at PyTorch's CUDA index —
  # and UV_TORCH_BACKEND covers anything reaching for the pip interface.
  UV_TORCH_BACKEND: cpu
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev --no-sources

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: mypy
        run: uv run mypy

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev --no-sources --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest --cov --cov-report=xml -m "not gpu"

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  smoke:
    name: End-to-end smoke run
    runs-on: ubuntu-latest
    # The unit tests mock the dataloader and never run the CLI, so nothing else
    # here would notice a config field that stopped reaching the trainer, a
    # checkpoint that no longer round-trips, or a subcommand wired to the wrong
    # argument. This runs the quickstart from the README, start to finish, on
    # the config that exists for exactly that purpose.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev --no-sources

      # MNIST is 63 MB from a third-party mirror. Caching it keeps a run from
      # depending on that mirror being up, and takes the download off every
      # build but the first.
      - name: Cache MNIST
        uses: actions/cache@v4
        with:
          path: data/MNIST
          key: mnist-v1

      - name: Train one epoch
        run: uv run tinydiffusion train --config configs/smoke.toml --set num_workers=2

      - name: Sample the checkpoint
        run: >-
          uv run tinydiffusion sample
          --checkpoint runs/smoke/checkpoints/last.pt
          --out runs/smoke/gen.png --num-images 8 --labels 0,1,2,3

      # The other spacing and the other sampler, so neither can rot unnoticed:
      # only this job ever runs them against a real checkpoint.
      - name: Sample with the fast solver on a quadratic grid
        run: >-
          uv run tinydiffusion sample
          --checkpoint runs/smoke/checkpoints/last.pt
          --out runs/smoke/gen_dpmpp.png --num-images 8
          --sampler dpmpp --steps 15 --spacing quadratic

      # karras is the one spacing that reads the schedule rather than only the
      # step count, so it is the one that can break on a real model without any
      # unit test noticing.
      - name: Sample on the karras grid
        run: >-
          uv run tinydiffusion sample
          --checkpoint runs/smoke/checkpoints/last.pt
          --out runs/smoke/gen_karras.png --num-images 4
          --steps 20 --spacing karras

      - name: Walk between two latents
        run: >-
          uv run tinydiffusion interpolate
          --checkpoint runs/smoke/checkpoints/last.pt
          --out runs/smoke/walk.png --steps 6 --labels 7

      - name: Score the checkpoint
        run: uv run tinydiffusion eval --checkpoint runs/smoke/checkpoints/best.pt

      # The only place the figure is drawn from metrics a real run wrote, which
      # is where the panel names and the metric names have to agree.
      - name: Plot the run's metrics
        run: uv run tinydiffusion plot runs/smoke --out runs/smoke/metrics.png

      - name: Resume from the checkpoint
        # Nothing to run — the checkpoint already covers the config's one epoch
        # — but it exercises the compatibility check and the config round trip,
        # which is where a resume actually breaks.
        run: uv run tinydiffusion train --resume runs/smoke/checkpoints/last.pt

      - name: Check the run produced what it promises
        run: |
          set -euo pipefail
          expected=(
            runs/smoke/checkpoints/last.pt
            runs/smoke/checkpoints/best.pt
            runs/smoke/contents/sample_0001.png
            runs/smoke/metrics.jsonl
            runs/smoke/gen.png
            runs/smoke/gen_dpmpp.png
          )
          for f in "${expected[@]}"; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done

      - name: Upload the generated digits
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-samples
          path: runs/smoke/*.png
          if-no-files-found: warn

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
