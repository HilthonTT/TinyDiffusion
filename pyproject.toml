[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinydiffusion"
# Read from src/tinydiffusion/version.py, so the number lives in exactly one place.
dynamic = ["version"]
description = "A PyTorch implementation of a diffusion model for image generation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hilthon" }]
requires-python = ">=3.14"
keywords = ["diffusion", "ddpm", "pytorch", "generative", "image-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.13.0",
    "torchvision>=0.24",
    "numpy>=2.1",
    "pydantic>=2.9",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
# Optional experiment tracking / logging backends.
tracking = ["tensorboard>=2.18"]
# The HTTP sampling server (`tinydiffusion serve`).
server = ["fastapi>=0.115", "uvicorn>=0.32"]

[project.urls]
Homepage = "https://github.com/HilthonTT/TinyDiffusion"
Repository = "https://github.com/HilthonTT/TinyDiffusion"
Issues = "https://github.com/HilthonTT/TinyDiffusion/issues"
Changelog = "https://github.com/HilthonTT/TinyDiffusion/blob/main/CHANGELOG.md"

[project.scripts]
tinydiffusion = "tinydiffusion.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    # Starlette's TestClient is built on httpx2; the older httpx raises a
    # deprecation warning that this project's filterwarnings turns into an error.
    "httpx2>=0.29",
    "ruff>=0.16.3",
    "mypy>=2.3.0",
    "pre-commit>=4.0",
]

# ---------------------------------------------------------------------------
# uv: where PyTorch comes from
# ---------------------------------------------------------------------------
# PyPI's torch wheel is CUDA-capable on Linux — it pulls the nvidia-* runtime
# packages — but CPU-only on Windows, where the CUDA builds live on PyTorch's
# own index instead. Left alone, `uv sync` therefore gives a Windows machine a
# CPU torch however good its GPU is, and puts the CPU wheel back over any
# manual fix the next time anything syncs.
#
# Pinning the Windows wheels to the CUDA index makes the GPU the default there,
# which is what a machine with a GPU wants. `explicit = true` keeps every other
# package coming from PyPI.
#
# CI opts out with `--no-sources`, which ignores this table: hosted runners
# have no GPU, and the CUDA wheels are gigabytes.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'" }]

[tool.hatch.version]
path = "src/tinydiffusion/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tinydiffusion"]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "ANN",  # flake8-annotations
    "D",    # pydocstyle
]
ignore = [
    "D100", # missing docstring in public module
    "D104", # missing docstring in public package
    "D107", # missing docstring in __init__ (documented on the class)
    "ANN401", # allow Any where it is genuinely needed
    "N812", # `import torch.nn.functional as F` is the universal PyTorch spelling
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
# Library code is strictly typed; tests are linted by ruff but not type-checked,
# so fixtures and parametrised cases stay readable.
files = ["src"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["torchvision.*", "tqdm.*", "tensorboard.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `nn.Module.__call__` is typed as returning Any, so every `return self.layer(x)`
# trips warn_return_any. Our own `forward` annotations are the real contract;
# strictness stays on for everything else.
module = ["tinydiffusion.*"]
warn_return_any = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "slow: tests that take more than a few seconds (deselect with '-m \"not slow\"')",
    "gpu: tests that require a CUDA device",
]
filterwarnings = ["error", "default::DeprecationWarning"]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/tinydiffusion"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
