# Training config for `tinydiffusion train --config configs/mnist.toml`.
#
# These values are the TrainConfig defaults, written out so a run is
# reproducible from the file alone — the one exception is [conditioning],
# which defaults to off and is turned on here. Tables are grouping only: every
# key is flattened into TrainConfig, so a key must name a real field and may
# appear in exactly one table.

[data]
dataset = "mnist"       # see configs/cifar10.toml for the other registered sets
data_root = "data"
image_size = 32
batch_size = 128
num_workers = 4

[model]
base_channels = 64
channel_mult = [1, 2, 2]
num_res_blocks = 2
attn_resolutions = [16]
dropout = 0.1

# Class-conditional training on the ten digits. class_dropout is the fraction
# of labels replaced by the null token, which is what gives the network an
# unconditional prediction for guidance to extrapolate away from; without it
# there is nothing to guide against. guidance applies at sample time only —
# 1.0 is the plain conditional prediction, and higher trades diversity for
# cleaner digits at the cost of a second forward pass per step.
# Comment the whole table out to train unconditionally; TOML has no null, so
# there is no value of num_classes that means "off".
[conditioning]
num_classes = 10
class_dropout = 0.1
guidance = 2.0

[diffusion]
num_timesteps = 1000
schedule = "cosine"     # "cosine" or "linear"
beta_start = 1e-4       # linear schedule only
beta_end = 0.02         # linear schedule only

# The parameterisation. These three defaults are the DDPM baseline, and are
# built as the DDPM class itself; any other combination is served by
# GaussianDiffusion. For Nichol & Dhariwal's improved DDPM — which samples well
# in far fewer steps — set variance = "learned_range" and objective =
# "rescaled_mse", which also doubles the U-Net's output channels.
predict = "epsilon"       # "epsilon", "v", "start_x" or "previous_x"
variance = "fixed_small"  # "fixed_small", "fixed_large", "learned_range", "learned"
objective = "mse"         # "mse", "rescaled_mse", "kl" or "rescaled_kl"

# Velocity prediction on a schedule rescaled to zero terminal SNR. The two go
# together: the rescaling removes the trace of image brightness that x_T
# otherwise keeps, and epsilon prediction has nothing left to predict at t = T
# once it is gone, so predict = "v" is required (or "start_x"). Worth having
# for short sampling chains; see USAGE.md.
zero_snr = false

# How the timesteps are weighted against each other, and how they are drawn.
# "min_snr" clamps each timestep's weight at min_snr_gamma so the nearly solved
# low-noise steps stop dominating the gradient; "loss_second_moment" samples
# timesteps in proportion to their recent RMS loss, which mostly matters for
# the variational objectives.
loss_weighting = "uniform"      # "uniform" or "min_snr"
min_snr_gamma = 5.0             # the clamp, under "min_snr"
timestep_sampler = "uniform"    # "uniform" or "loss_second_moment"

[optimisation]
num_epochs = 30
lr = 2e-4
lr_warmup = 500          # optimiser steps to ramp the LR over; 0 disables
grad_clip = 1.0
ema_decay = 0.9999
ema_warmup = 2000

[bookkeeping]
seed = 0
# Batch order is a function of seed and epoch index either way, so a resumed
# run sees the epochs it would have seen unresumed. deterministic goes further
# and pins the CUDA kernels too, at a noticeable throughput cost.
deterministic = false
amp = true
sample_every = 1
num_samples = 16
# "ddim" at 50 steps, or one of three deterministic solvers that beat its
# first-order step: "dpmpp" (DPM-Solver++(2M)) at 15-20 for the same result and
# a third of the time, "heun" for second order from a second network call a
# step, or "plms" for fourth order from history at 20 steps or more. The field
# also decides what `sample` and `fid` default to for checkpoints from this run.
sampler = "ddim"
sample_steps = 50
out_dir = "contents"
ckpt_dir = "checkpoints"

[tracking]
log_dir = "runs/mnist"  # holds metrics.jsonl, and tb/ when tensorboard is on
log_console = true      # per-epoch metrics table
log_jsonl = true        # append metrics.jsonl
tensorboard = false     # needs the 'tracking' extra
wandb = false           # stream to Weights & Biases; needs the 'tracking' extra
wandb_project = "tinydiffusion"
