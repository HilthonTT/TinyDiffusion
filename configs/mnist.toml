# Training config for `tinydiffusion train --config configs/mnist.toml`.
#
# These values are the TrainConfig defaults, written out so a run is
# reproducible from the file alone. Tables are grouping only: every key is
# flattened into TrainConfig, so a key must name a real field and may appear
# in exactly one table.

[data]
data_root = "data"
image_size = 32
batch_size = 128
num_workers = 4

[model]
base_channels = 64
channel_mult = [1, 2, 2]
num_res_blocks = 2
attn_resolutions = [16]
dropout = 0.1

[diffusion]
num_timesteps = 1000
schedule = "cosine"     # "cosine" or "linear"
beta_start = 1e-4       # linear schedule only
beta_end = 0.02         # linear schedule only

# The parameterisation. These three defaults are the DDPM baseline, and are
# built as the DDPM class itself; any other combination is served by
# GaussianDiffusion. For Nichol & Dhariwal's improved DDPM — which samples well
# in far fewer steps — set variance = "learned_range" and objective =
# "rescaled_mse", which also doubles the U-Net's output channels.
predict = "epsilon"       # "epsilon", "start_x" or "previous_x"
variance = "fixed_small"  # "fixed_small", "fixed_large", "learned_range", "learned"
objective = "mse"         # "mse", "rescaled_mse", "kl" or "rescaled_kl"

[optimisation]
num_epochs = 30
lr = 2e-4
grad_clip = 1.0
ema_decay = 0.9999
ema_warmup = 2000

[bookkeeping]
seed = 0
amp = true
sample_every = 1
num_samples = 16
sample_steps = 50
out_dir = "contents"
ckpt_dir = "checkpoints"

[tracking]
log_dir = "runs/mnist"  # holds metrics.jsonl, and tb/ when tensorboard is on
log_console = true      # per-epoch metrics table
log_jsonl = true        # append metrics.jsonl
tensorboard = false     # needs the 'tracking' extra
