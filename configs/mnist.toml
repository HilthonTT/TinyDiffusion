# Example training config. Fields are indicative — the loader is not implemented yet.

[data]
dataset = "mnist"
root = "data/"
image_size = 32
channels = 1
batch_size = 128
num_workers = 4

[model]
base_channels = 64
channel_multipliers = [1, 2, 2]
attention_resolutions = [16]
dropout = 0.1

[diffusion]
timesteps = 1000
schedule = "cosine"

[training]
epochs = 50
learning_rate = 2e-4
ema_decay = 0.999
grad_clip = 1.0
mixed_precision = true
checkpoint_dir = "checkpoints/"
log_every = 100
